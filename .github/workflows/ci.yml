name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e '.[dev,bench]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Regenerate benchmarks
        run: python -m benchmarks

      - name: Check benchmark results are unchanged
        run: git diff --exit-code -- benchmarks/results/results.json benchmarks/results/results.md
