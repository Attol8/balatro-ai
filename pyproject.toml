[project]
name = "balatro-ai-v2"
version = "0.1.0"
description = "Clean-slate Balatro simulator and search agent experiments."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
candidate = [
  "jackdaw @ git+https://github.com/TylerFlar/jackdaw-balatro.git@dbedc66255fe594cce7b7cccc188c8a11649d9ec ; python_version >= '3.12'",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.package-data]
"balatro_ai_v2.solver" = ["candidate_data/jackdaw/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
