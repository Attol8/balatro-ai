[project]
name = "balatro-ai-v2"
version = "0.1.0"
description = "Public-information, authority-verified Balatro AI infrastructure."
requires-python = ">=3.11"
dependencies = [
    "cma>=4.4,<5",
]

[project.optional-dependencies]
candidate = [
  "jackdaw @ git+https://github.com/TylerFlar/jackdaw-balatro.git@dbedc66255fe594cce7b7cccc188c8a11649d9ec ; python_version >= '3.12'",
]
model = [
  "torch>=2.5",
]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["balatro_ai_v2*"]

[tool.setuptools.package-data]
balatro_ai_v2 = ["candidate_data/jackdaw/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
