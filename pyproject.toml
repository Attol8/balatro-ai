[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "balatro-ai"
version = "1.0.0"
description = "Astra low with public numerical tools for real Balatro"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
balatro = "balatro_ai.cli:main"

[tool.setuptools.packages.find]
include = ["balatro_ai*"]

[tool.setuptools.package-data]
balatro_ai = ["prompts/*.md", "knowledge/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
